# Release trigger: 2026-08-02 Home next-action controls
name: Publish Velunee preview OTA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/eas-update-preview.yml'

permissions:
  contents: read

concurrency:
  group: velunee-preview-ota
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Android preview update
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://hzumacmyzxdaqcrelobn.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_sEOnqDJ_7nySDFC-Nh2Wow_ca85ewKC
      EXPO_PUBLIC_API_URL: https://velunee-api.onrender.com/api/v1
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.11.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared mobile packages
        run: pnpm --filter @velunee/contracts --filter @velunee/ui build

      - name: Verify mobile types
        run: pnpm --filter @velunee/mobile typecheck

      - name: Publish Velunee update to preview
        working-directory: apps/mobile
        run: >-
          eas update
          --channel preview
          --environment preview
          --platform android
          --message "Velunee preview (${GITHUB_SHA::7})"
          --non-interactive
